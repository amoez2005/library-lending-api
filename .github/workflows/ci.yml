name: Build and acceptance tests
on:
  push:
    branches: [master, 'feature/**', 'qa/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit, database, HTTP and Cucumber tests; formatting; JavaDoc
        run: ./mvnw -B --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            target/surefire-reports/
            target/cucumber/
            target/site/
      - uses: actions/upload-artifact@v4
        with:
          name: shelf-application
          path: target/library-lending-api-1.0.0.jar
  postman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: ./mvnw -B --no-transfer-progress package -DskipTests
      - run: npm ci
      - name: Start API and run Postman collection
        shell: bash
        run: |
          java -jar target/library-lending-api-1.0.0.jar --spring.datasource.url=jdbc:h2:mem:postman > api.log 2>&1 &
          ready=0
          for i in {1..60}; do
            if curl --fail --silent http://localhost:8080/api >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat api.log; exit 1; fi
          npm run test:api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postman-report
          path: |
            artifacts/newman.json
            api.log
